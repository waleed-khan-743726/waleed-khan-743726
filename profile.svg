<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="2180"
     viewBox="0 0 1000 2180">

<defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#061f1e"/>
        <stop offset="50%" stop-color="#0a3835"/>
        <stop offset="100%" stop-color="#041918"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0c4a45"/>
        <stop offset="55%" stop-color="#07312f"/>
        <stop offset="100%" stop-color="#062422"/>
    </linearGradient>

    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c4541"/>
        <stop offset="100%" stop-color="#062522"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00d9c0"/>
        <stop offset="50%" stop-color="#69fff0"/>
        <stop offset="100%" stop-color="#00a995"/>
    </linearGradient>

    <linearGradient id="blueBar">
        <stop offset="0%" stop-color="#4b7dff"/>
        <stop offset="100%" stop-color="#64a4ff"/>
    </linearGradient>

    <linearGradient id="purpleBar">
        <stop offset="0%" stop-color="#8664ff"/>
        <stop offset="100%" stop-color="#bb91ff"/>
    </linearGradient>

    <filter id="glow">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="softGlow">
        <feGaussianBlur stdDeviation="12"/>
    </filter>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
        <rect width="18" height="18" rx="2" fill="#0b403d"/>
    </pattern>

    <clipPath id="avatarClip">
        <circle cx="74" cy="72" r="48"/>
    </clipPath>

</defs>

