<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Waleed — AI Engineer</title>
  <desc id="desc">Premium navy banner with cyan and gold accents describing an AI engineer who builds production-ready intelligent systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.62" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f6c85f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#91a4c2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="68" r="250" fill="url(#glow)"/>
  <circle cx="1120" cy="-20" r="92" fill="#f6c85f" fill-opacity="0.08" filter="url(#soft)"/>

  <path d="M935 85L1016 38l81 47v94l-81 47-81-47z" fill="none" stroke="#22d3ee" stroke-opacity="0.34" stroke-width="2"/>
  <path d="M975 109l41-24 41 24v47l-41 24-41-24z" fill="#22d3ee" fill-opacity="0.06" stroke="#f6c85f" stroke-opacity="0.56" stroke-width="1.5"/>
  <circle cx="1016" cy="132" r="12" fill="#22d3ee"/>
  <path d="M1016 120V85M1027 126l30-17M1027 140l30 17M1005 140l-30 17M1005 126l-30-17M1016 144v36" stroke="#c9d4e5" stroke-opacity="0.74" stroke-width="2"/>

  <rect x="72" y="68" width="188" height="34" rx="17" fill="#11253e" stroke="#22d3ee" stroke-opacity="0.48"/>
  <circle cx="92" cy="85" r="5" fill="#39e58c"/>
  <text x="108" y="91" fill="#b7c7dc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.1">OPEN TO IMPACT</text>

  <text x="72" y="178" fill="#f8fbff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.4">MUHAMMAD WALEED</text>
  <rect x="72" y="203" width="466" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="254" fill="#22d3ee" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3.6">AI ENGINEER</text>
  <text x="72" y="297" fill="#c9d4e5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21">Building production-ready intelligent systems</text>
  <text x="72" y="332" fill="#8394ad" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">VOICE AI  /  LLM SYSTEMS  /  COMPUTER VISION  /  AUTOMATION</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="650">
    <rect x="72" y="365" width="162" height="38" rx="19" fill="#11253e" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="153" y="389" text-anchor="middle" fill="#dce8f7">3+ YEARS BUILDING</text>
    <rect x="247" y="365" width="171" height="38" rx="19" fill="#11253e" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="332" y="389" text-anchor="middle" fill="#dce8f7">END-TO-END AI</text>
    <rect x="431" y="365" width="169" height="38" rx="19" fill="#11253e" stroke="#f6c85f" stroke-opacity="0.45"/>
    <text x="515" y="389" text-anchor="middle" fill="#f6c85f">GLOBAL MINDSET</text>
  </g>

  <path d="M0 436H1200" stroke="url(#accent)" stroke-width="8"/>
</svg>
