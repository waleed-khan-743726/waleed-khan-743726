<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">Build with Muhammad Waleed</title>
  <desc id="desc">Premium call to action for AI product engineering, voice agents, computer vision, and intelligent automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.52" stop-color="#10213c"/>
      <stop offset="1" stop-color="#0c1426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f6c85f"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8ca0c0" stroke-opacity=".06"/></pattern>
  </defs>

  <rect width="1180" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1180" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="590" cy="100" r="360" fill="url(#glow)"/>
  <rect y="414" width="1180" height="6" fill="url(#accent)"/>

  <text x="590" y="56" text-anchor="middle" fill="#22d3ee" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="3">OPEN FOR HIGH-IMPACT WORK</text>
  <text x="590" y="108" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="800">From ambitious idea to working AI product.</text>
  <text x="590" y="142" text-anchor="middle" fill="#9fb0c8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Bring the problem. I’ll help shape the intelligence, engineering, and path to production.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="56" y="184" width="332" height="126" rx="18" fill="#0d1d33" stroke="#22d3ee" stroke-opacity=".55"/>
    <circle cx="88" cy="218" r="12" fill="#22d3ee"/>
    <text x="112" y="224" fill="#f8fafc" font-size="17" font-weight="750">AI PRODUCT ENGINEERING</text>
    <text x="82" y="258" fill="#9fb0c8" font-size="13">Models, APIs, interfaces, evaluation,</text>
    <text x="82" y="280" fill="#9fb0c8" font-size="13">and production-minded architecture.</text>

    <rect x="424" y="184" width="332" height="126" rx="18" fill="#0d1d33" stroke="#a78bfa" stroke-opacity=".58"/>
    <circle cx="456" cy="218" r="12" fill="#a78bfa"/>
    <text x="480" y="224" fill="#f8fafc" font-size="17" font-weight="750">VOICE &amp; AI AGENTS</text>
    <text x="450" y="258" fill="#9fb0c8" font-size="13">Conversational systems, tool use, RAG,</text>
    <text x="450" y="280" fill="#9fb0c8" font-size="13">speech intelligence, and automation.</text>

    <rect x="792" y="184" width="332" height="126" rx="18" fill="#0d1d33" stroke="#f6c85f" stroke-opacity=".58"/>
    <circle cx="824" cy="218" r="12" fill="#f6c85f"/>
    <text x="848" y="224" fill="#f8fafc" font-size="17" font-weight="750">VISION &amp; AUTOMATION</text>
    <text x="818" y="258" fill="#9fb0c8" font-size="13">Computer vision, real-time pipelines,</text>
    <text x="818" y="280" fill="#9fb0c8" font-size="13">edge inference, and smart workflows.</text>
  </g>

  <rect x="418" y="342" width="344" height="48" rx="24" fill="url(#accent)"/>
  <text x="590" y="372" text-anchor="middle" fill="#07101f" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.3">LET’S BUILD SOMETHING VALUABLE  →</text>
</svg>
